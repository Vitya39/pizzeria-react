<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felhasználó Kezelő (CRUD)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-center">Felhasználó Kezelő Rendszer</h2>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0" id="formTitle">Új Felhasználó</h5>
                    </div>
                    <div class="card-body">
                        <form id="userForm">
                            <input type="hidden" id="userId">
                            <div class="mb-3">
                                <label class="form-label">Családi név</label>
                                <input type="text" id="csaladi_nev" class="form-control" maxlength="45" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Utónév</label>
                                <input type="text" id="uto_nev" class="form-control" maxlength="45" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Bejelentkezés (Felhasználónév)</label>
                                <input type="text" id="bejelentkezes" class="form-control" maxlength="12" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Jelszó</label>
                                <input type="password" id="jelszo" class="form-control" maxlength="40" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mb-2" id="saveBtn">Mentés</button>
                            <button type="button" class="btn btn-secondary w-100 d-none" id="cancelBtn">Mégse</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body overflow-auto">
                        <table class="table table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Családi név</th>
                                    <th>Utónév</th>
                                    <th>Bejelentkezés</th>
                                    <th>Jelszó</th>
                                    <th class="text-center">Műveletek</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/fetchapi.js"></script>
</body>

</html>
