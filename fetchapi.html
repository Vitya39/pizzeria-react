<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Kezelő (CRUD - Fetch API)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar {
            background-color: rgba(0, 0, 0, 0.8) !important;
            padding-left: 20px;
        }

        .nav-link {
            color: #fff !important;
        }

        .nav-link:hover {
            color: #ffc107 !important;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-center">Pizza Kezelő Rendszer</h2>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0" id="formTitle">Új pizza</h5>
                    </div>
                    <div class="card-body">
                        <form id="pizzaForm">
                            <div class="mb-3">
                                <label class="form-label">Megnevezés</label>
                                <input type="text" id="nev" class="form-control" maxlength="45" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Kategória</label>
                                <input type="text" id="kategoria" class="form-control" maxlength="45" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Vegetáriánus</label>
                                <input type="text" id="vegetarianus" class="form-control" maxlength="12" required>
                            </div>
                            <input type="hidden" id="originalNev">
                            <button type="submit" class="btn btn-success w-100 mb-2" id="saveBtn">Mentés</button>
                            <button type="button" class="btn btn-secondary w-100 d-none" id="cancelBtn">Mégse</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body overflow-auto">
                        <table class="table table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>Megnevezés</th>
                                    <th>Kategória</th>
                                    <th>Vegetáriánus</th>
                                    <th class="text-center">Műveletek</th>
                                </tr>
                            </thead>
                            <tbody id="pizzaTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/fetchapi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
